# Resource Profile: MEDIUM
# Balanced CPU & memory allocation for baseline performance evaluation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-workload-backend
  namespace: ai-workload
spec:
  template:
    spec:
      containers:
      - name: ai-backend
        resources:
          requests:
            cpu: "300m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
