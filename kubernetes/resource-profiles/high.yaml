# Resource Profile: HIGH
# High-capacity profile for maximum concurrency and minimal queuing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-workload-backend
  namespace: ai-workload
spec:
  template:
    spec:
      containers:
      - name: ai-backend
        resources:
          requests:
            cpu: "800m"
            memory: "512Mi"
          limits:
            cpu: "1200m"
            memory: "1024Mi"
