apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ai-workload
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        orgId: 1
        url: http://prometheus-service.ai-workload.svc.cluster.local:9090
        isDefault: true
        version: 1
        editable: false
