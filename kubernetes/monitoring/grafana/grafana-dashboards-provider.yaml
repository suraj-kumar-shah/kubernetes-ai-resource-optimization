apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: ai-workload
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'AI Workload Research'
        orgId: 1
        folder: 'Kubernetes Research'
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards
